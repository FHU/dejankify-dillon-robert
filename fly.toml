# fly.toml app configuration file generated for dejankify-dillon-robert on 2026-04-29T21:08:38-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'dejankify-dillon-robert'
primary_region = 'ord'

[deploy]
  release_command = '/app/node_modules/.bin/prisma migrate deploy --schema=/app/prisma/schema.prisma'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
